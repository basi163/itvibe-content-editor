[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "itvibe-content-editor"
version = "0.1.0"
description = "IT Vibe Telegram newsroom bot"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "python-dotenv>=1.0,<2",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
itvibe-editor = "app.main:run"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
